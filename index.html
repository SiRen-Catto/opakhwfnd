<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- default(白色), black(黑色), black-translucent(透明沉浸式) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="NoteSRi">
    <meta name="theme-color" content="#050505">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA manifest for app installation and home screen support -->
    <link rel="apple-touch-icon" href="https://iili.io/CKCd1Yx.md.png">
    <link rel="manifest" href="manifest.webmanifest">

    <title>NoteSRi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 全局样式变量 */
        :root { 
            --bg: #000000; 
            --surface: #050505; 
            --surface-hover: #1e1e1e; 
            --border: #333333; 
            --text-main: #e0e0e0; 
            --text-dim: #666666; 
            --accent: #ffffff; 
            --radius-sm: 4px; 
            --radius-md: 8px; 
            --radius-lg: 16px; 
            --font-stack: Calibri; 
            --anim-curve: cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        /* 勿动 */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }
        /* 整体样式与布局 */
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            font-family: var(--font-stack); 
            margin: 0; 
            height: 100vh; 
            height: 100dvh;
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        /* 手机屏幕 */
        #app-frame { 
            width: 100%; 
            height: 100%; 
            max-width: 420px; 
            max-height: 900px; 
            background: var(--bg); 
            position: relative; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        
        header { 
            height: 60px; 
            display: flex; 
            align-items: center; 
            padding: 0 20px; 
            border-bottom: 1px solid var(--border); 
            position: relative; 
            z-index: 100; 
            background: rgba(5,5,5,0.9); 
            -webkit-backdrop-filter: blur(5px); 
            backdrop-filter: blur(5px); 
        }

        .user-widget { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            cursor: pointer; 
            transition: opacity 0.2s; 
            border-radius: var(--radius-sm); 
        }
        .user-widget:active { opacity: 0.6; background: var(--surface); }
        .avatar { width: 32px; height: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; }
        
        .dropdown { 
            position: absolute; 
            top: 60px; 
            left: 12px; 
            width: 140px; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            border-top: none; 
            opacity: 0; 
            pointer-events: none; 
            transform: translateY(-10px); 
            transition: all 0.3s var(--anim-curve); 
            display: flex; 
            flex-direction: column; 
        }
        .dropdown.active { 
            opacity: 1; 
            pointer-events: auto; 
            transform: translateY(0); 
        }
        .dropdown-item { 
            padding: 10px 10px; 
            border-bottom: 1px solid var(--border); 
            font-size: 12px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .dropdown-item:hover { background: var(--surface); }
        .dropdown-item:last-child { border-bottom: none; }
        main { flex: 1; position: relative; overflow: hidden; }
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 20px; overflow-y: auto; opacity: 0; transform: scale(0.98); pointer-events: none; transition: opacity 0.3s var(--anim-curve), transform 0.3s var(--anim-curve); }
        .page.active { opacity: 1; transform: scale(1); pointer-events: auto; }
        .calendar-tabs { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; font-size: 12px; color: var(--text-dim); }
        .tab { cursor: pointer; padding-bottom: 2px; position: relative; }
        .tab.active { color: var(--text-main); }
        .tab.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 1px; background: var(--text-main); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 10px; }
        .weekday { text-align: center; font-size: 10px; color: var(--text-dim); margin-bottom: 10px; }
        .day { aspect-ratio: 1; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; padding: 4px; border: 1px solid var(--surface); font-size: 12px; position: relative; transition: border-color 0.2s; }
        .day:hover { border-color: var(--border); }
        .day.today { border: 1px solid var(--text-main); background: var(--surface); }
        .day.empty { border: none; }
        .day-dot { width: 4px; height: 4px; background: var(--text-dim); border-radius: 50%; position: absolute; bottom: 4px; right: 4px; }
        .role-list { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .stamp-card { background: var(--bg); border: 1px solid var(--border); padding: 15px; display: flex; align-items: center; gap: 15px; position: relative; cursor: pointer; transition: transform 0.2s; background-size: cover !important; background-position: center !important; overflow: hidden; }
        .stamp-card:active { transform: scale(0.98); }
        .stamp-card::before { content: ''; position: absolute; top: 5px; right: 5px; width: 40px; height: 50px; border: 1px solid var(--border); background: radial-gradient(circle, var(--surface) 20%, transparent 20%) 0 0 / 4px 4px; z-index: 3; }
        .stamp-card::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); z-index: 1; }
        .stamp-card > * { position: relative; z-index: 2; }
        .role-info h3 { margin: 0; font-size: 16px; font-weight: normal; }
        .role-info p { margin: 5px 0 0; font-size: 11px; color: var(--text-dim); }
        .add-role-card { border: 1px dashed var(--text-dim); padding: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; opacity: 0.6; transition: opacity 0.2s; min-height: 80px; }
        .add-role-card:hover { opacity: 1; background: var(--surface); }
        .chat-container { display: flex; flex-direction: column; gap: 15px; }
        .chat-bubble { max-width: 80%; padding: 10px 12px; font-size: 13px; line-height: 1.4; position: relative; border-radius: var(--radius-md); }
        .chat-bubble.received { background: var(--surface); align-self: flex-start; border-top-left-radius: 0; }
        .chat-bubble.sent { background: #222; border: 1px solid var(--border); align-self: flex-end; border-top-right-radius: 0; }
        .chat-time { font-size: 9px; color: var(--text-dim); text-align: right; margin-top: 4px; }
        .bottom-bar { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; height: 60px; background: rgba(18, 18, 18, 0.85); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 200; }
        .nav-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: var(--text-dim); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.3s var(--anim-curve); position: relative; }
        .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .nav-btn.active { color: var(--text-main); background: var(--surface-hover); transform: translateY(-2px); }
        .nav-btn::after { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.1); transform: scale(0); opacity: 0; }
        .nav-btn:active::after { animation: bubble 0.4s ease-out; }
        @keyframes bubble { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
        .hidden { display: none; }
        .text-center { text-align: center; margin-top: 50px; color: var(--text-dim); }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .loading-overlay.active { opacity: 1; pointer-events: auto; }
        .loader-spinner { width: 40px; height: 40px; border: 1px solid #333; border-top: 1px solid #fff; border-radius: 50%; animation: spin 1s linear infinite; }
        .loading-text { margin-top: 20px; font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 2px; color: #666; animation: blink 1.5s infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; justify-content: center; align-items: flex-end; }
        .modal-overlay.active { display: flex; animation: fadeIn 0.3s; }
        .edit-card { width: 100%; max-width: 420px; height: 90%; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-lg) var(--radius-lg) 0 0; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .edit-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(5,5,5,0.95); }
        .btn-text { background: none; border: none; color: var(--text-main); font-family: var(--font-stack); cursor: pointer; font-size: 14px; }
        .btn-save { background: var(--text-main); color: var(--bg); padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .edit-body { flex: 1; overflow-y: auto; position: relative; }
        .banner-upload { height: 120px; background: var(--surface); position: relative; background-size: cover; background-position: center; cursor: pointer; border-bottom: 1px solid var(--border); }
        .banner-upload::after { content: 'CHANGE BANNER'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 10px; color: rgba(255,255,255,0.5); pointer-events: none; }
        .avatar-upload-wrapper { position: absolute; top: 90px; left: 20px; width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--bg); background: var(--surface); cursor: pointer; overflow: hidden; background-size: cover; background-position: center; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .avatar-upload-wrapper span { font-size: 24px; pointer-events: none; }
        .form-group { padding: 20px; margin-top: 40px; display: flex; flex-direction: column; gap: 20px; }
        .input-box { position: relative; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; transition: border-color 0.2s; }
        .input-box:focus-within { border-color: var(--text-main); }
        .input-label { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; display: block; }
        .input-field { width: 100%; background: none; border: none; color: var(--text-main); font-family: var(--font-stack); font-size: 14px; outline: none; }
        select.input-field { -webkit-appearance: none; appearance: none; border-radius: 0; }
        .img-picker-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: var(--radius-md); text-align: center; display: none; flex-direction: column; gap: 10px; z-index: 2100; }
        .img-picker-modal.active { display: flex; }
        .picker-btn { padding: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text-main); cursor: pointer; }
        .picker-btn:hover { background: var(--surface-hover); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="app-frame">
        <header>
            <div class="user-widget" id="userTrigger">
                <div class="avatar" id="currentAvatar"></div>
                <svg width="10" height="10" viewBox="0 0 10 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 3L5 6L8 3" stroke="#666" stroke-width="1.5"/>
                </svg>
            </div>
            <div class="dropdown" id="roleDropdown"></div>
        </header>
        
        <div class="phone-container"></div>
        <!-- 所有的页面内容将由外部JS动态注入到这里 -->
        <main id="main-content"></main>

        <nav class="bottom-bar">
            <button class="nav-btn active" onclick="switchPage('page-calendar', this)" title="日历" aria-label="日历">
                <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
            </button>
            <button class="nav-btn" onclick="switchPage('page-roles', this)" title="角色" aria-label="角色">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
            <button class="nav-btn" onclick="switchPage('page-chat', this)" title="聊天" aria-label="聊天">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            </button>
            <button class="nav-btn" onclick="switchPage('page-star', this)" title="收藏" aria-label="收藏">
                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </button>
            <button class="nav-btn" onclick="switchPage('page-more', this)" title="更多" aria-label="更多">
                <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
            <button class="nav-btn" onclick="openSRiPhone()" title="SR_iPhone" aria-label="SR_iPhone">
                <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
            </button>
        </nav>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="loader-spinner"></div>
        <div class="loading-text">CONNECTING TO SR_iPhone...</div>
    </div>

    <script>
        // 全局页面切换及功能
        function switchPage(pageId, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId);
            if(target) target.classList.add('active');
        }

        function openSRiPhone() {
            document.getElementById('loading-overlay').classList.add('active');
            setTimeout(() => { window.location.href = 'SRiPhone/phone.html'; }, 1500);
        }
    </script>
    
    <!-- 引入分离的5个模块 -->
    <script src="calendar.js"></script>
    <script src="roles.js"></script>
    <script src="chat.js"></script>
    <script src="star.js"></script>
    <script src="more.js"></script>
    <script src="tutorial.js"></script>
    <script src="pendant.js"></script>
    <script src="SRiPhone/dynamicIsland.js"></script> 
</body>
</html>
