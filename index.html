<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- default(白色), black(黑色), black-translucent(透明沉浸式) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="NoteSRi">
    <meta name="theme-color" content="#050505">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA manifest for app installation and home screen support -->
    <link rel="apple-touch-icon" href="https://iili.io/CKCd1Yx.md.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css">

    <title>NoteSRi</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="app-frame">
        <header>
            <div class="user-widget" id="userTrigger">
                <div class="avatar" id="currentAvatar"></div>
            </div>
            <div class="dropdown" id="roleDropdown"></div>
        </header>
        
        <div class="phone-container"></div>
        <!-- 所有的页面内容将由外部JS动态注入到这里 -->
        <main id="main-content"></main>

        <nav class="bottom-bar">
            <button class="nav-btn active" onclick="switchPage('page-calendar', this)" title="日历" aria-label="日历">
                <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
            </button>
            <button class="nav-btn" onclick="switchPage('page-roles', this)" title="角色" aria-label="角色">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </button>
            <button class="nav-btn" onclick="switchPage('page-chat', this)" title="聊天" aria-label="聊天">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
            </button>
            <button class="nav-btn" onclick="switchPage('page-star', this)" title="收藏" aria-label="收藏">
                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </button>
            <button class="nav-btn" onclick="switchPage('page-more', this)" title="更多" aria-label="更多">
                <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
            <button class="nav-btn" onclick="openSRiPhone()" title="SR_iPhone" aria-label="SR_iPhone">
                <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
            </button>
        </nav>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="loader-spinner"></div>
        <div class="loading-text">CONNECTING TO SR_iPhone...</div>
    </div>

    <script>
        // 全局页面切换及功能
        function switchPage(pageId, btn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const target = document.getElementById(pageId);
            if(target) target.classList.add('active');
        }

        function openSRiPhone() {
            document.getElementById('loading-overlay').classList.add('active');
            setTimeout(() => { window.location.href = 'SRiPhone/phone.html'; }, 1500);
        }
    </script>
    
    <!-- 引入分离的5个模块 -->
    <script src="calendar.js"></script>
    <script src="roles.js"></script>
    <script src="chat.js"></script>
    <script src="star.js"></script>
    <script src="more.js"></script>
    <script src="tutorial.js"></script>
    <script src="pendant.js"></script>
    <script src="SRiPhone/dynamicIsland.js"></script> 
</body>
</html>
